<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro en nuestra tienda</title>
    <!-- Instrucción 1: Enlazado al archivo dentro de la carpeta css -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <h1>Registro en nuestra tienda</h1>

    <form action="#" method="post">
        <!-- Nombre de usuario -->
        <label for="usuario">Nombre de usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="Ej: luis">

        <!-- Email (Instrucción 5: name="email") -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Ej: luis@gmail.com">

        <!-- Edad -->
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" placeholder="Ej: 21">

        <!-- Fecha de nacimiento -->
        <label for="fecha">Fecha de nacimiento:</label>
        <input type="date" id="fecha" name="fecha">

        <!-- Género (Radio buttons) -->
        <p>Género:</p>
        <div class="radio-grupo">
            <label><input type="radio" name="genero" value="masculino"> Masculino</label>
            <label><input type="radio" name="genero" value="femenino"> Femenino</label>
        </div>

        <!-- Recomendado por (Select) -->
        <label for="recomendado">Recomendado por:</label>
        <select id="recomendado" name="recomendado">
            <option value="google">Google</option>
            <option value="facebook">Facebook</option>
            <option value="amigo">Un amigo</option>
            <option value="otro">Otro</option>
        </select>

        <!-- Comentarios (Instrucción 2: sin atributos rows ni cols) -->
        <label for="comentarios">Comentarios:</label>
        <textarea id="comentarios" name="comentarios"></textarea>

        <!-- Acepto términos y condiciones -->
        <p>Acepto terminos y condiciones:</p>
        <input type="checkbox" id="terminos" name="terminos" class="input-checkbox">

        <!-- Botón de envío -->
        <button type="submit">Registrar</button>
    </form>

</body>
</html>
